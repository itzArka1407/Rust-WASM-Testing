[package]
name = "wasm-bitcode-demo"
version = "0.1.0"
edition = "2024"
description = "Purely for testing out wasm. Not professional"
repository = "https://github.com/itzArka1407/Rust-WASM-Testing"
license = ""

[lib]
crate-type = ["cdylib"]

[dependencies]
bitcode = { version = "0.6.9", features = ["serde", "uuid"] }
js-sys = "0.3.100"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
uuid = { version = "1.23.3", features = ["serde", "v4", "v7", "js"] }
wasm-bindgen = "0.2.121"
