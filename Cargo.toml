[package]
name = "wasm-bitcode-demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bitcode = { version = "0.6.9", features = ["serde", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.3", features = ["serde", "v4", "v7"] }
wasm-bindgen = "0.2.121"
