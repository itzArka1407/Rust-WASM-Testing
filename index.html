<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rust Wasm Demo</title>
</head>

<body>
    <div id="app-view"></div>

    <script type="module">
        // 1. Import the default initializer along with your struct
        import init, {DataPipeline} from "../pkg/wasm_bitcode_demo.js";
        import wasmActions from "./src_frontend/simple_wasm_functions.js";

        const appView = document.getElementById('app-view');

        // Keep a clear, localized reference to the compiled wasm module instance
        let wasmInstance = null;

        // --- ROUTING FUNCTIONS ---

        async function loadHomePage() {
            const res = await fetch("./src_frontend/home_page_buttons.html");
            appView.innerHTML = await res.text();

            // Bind Home Page Events immediately after they are injected
            document.getElementById('obj-btn').addEventListener('click', wasmActions.send_obj);
            document.getElementById('sum-btn').addEventListener('click', wasmActions.get_sum_of_arr);
            document.getElementById('connections-slow-btn').addEventListener('click', wasmActions.evaluate_connection_slow);
            document.getElementById('connections-fast-btn').addEventListener('click', wasmActions.evaluate_connection_fast);
            document.getElementById('single-conv-connections-btn').addEventListener('click', wasmActions.evaluate_single_conv);

            // Handle page routing
            document.getElementById('data-pipeline-page-btn').addEventListener('click', loadDataPipelinePage);
        }

        async function loadDataPipelinePage() {
            const res = await fetch("./src_frontend/data_pipeline.html");
            appView.innerHTML = await res.text();

            // Bind Data Pipeline Events immediately after they are injected
            document.getElementById('pipeline-sending-button').addEventListener('click', sendData);
            document.getElementById('home-page-btn').addEventListener('click', loadHomePage);
        }

        // --- DATA PROCESSING LOGIC ---

        function sendData() {
            // Guard clause: Make sure Wasm is actually ready before allocating
            if (!wasmInstance) {
                console.error("Wasm instance is not initialized yet.");
                return;
            }

            let reserved_size = 1024 * 1024; // 1MB arena allocation block
            const pipeLine = new DataPipeline(reserved_size);
            const ptr = pipeLine.get_data_ptr();

            const testPacket = new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8, 9]);
            const packetLen = testPacket.length;

            // Use the verified wasmInstance memory buffer safely
            const wasmMemoryView = new Uint8Array(wasmInstance.memory.buffer, ptr, packetLen);
            wasmMemoryView.set(testPacket);

            pipeLine.process(packetLen);
            console.log("WASM Data pipeline processed packet successfully!");

            // Clean up the pipeline instance handle when done to avoid memory leaks
            pipeLine.free();
        }

        // Global Bootstrapper: Initialize Wasm once, then reveal the application
        async function boot() {
            try {
                // Initialize and capture the exports object (holds the raw memory buffer)
                wasmInstance = await init();

                // Now that memory is bound safely, load the home page views
                await loadHomePage();
            } catch (err) {
                console.error("Failed to initialize WebAssembly engine:", err);
            }
        }

        boot();
    </script>
</body>

</html>
