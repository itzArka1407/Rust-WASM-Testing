<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rust Wasm Demo</title>
</head>

<body>
    <button id="obj-btn">Press to send obj</button>
    <button id="sum-btn">Press to get sum</button>
    <button id="connections-slow-btn">Press to set up connection slowly</button>
    <button id="connections-fast-btn">Press to set up connection fast</button>

    <script type="module">
        // 1. Updated import to match your actual build output file name
        import init, {accept_js_obj, calc_sum, config_engine_slowly, config_engine_fast} from './pkg/wasm_bitcode_demo.js';
        await init();

        function send_obj() {
            const obj = {name: "Test", id: 62};
            accept_js_obj(obj);
        }

        function get_sum_of_arr() {
            const test_arr = new Uint8Array([10, 20, 30, 40, 50]);
            let sum = calc_sum(test_arr);
            console.log("Sum of array: ", sum);
        }

        function evaluate_connection_slow() {
            const userConfig = {username: "Jack", connections: 10, use_tls: false};
            config_engine_slowly(userConfig);
        }

        function evaluate_connection_fast() {
            const userConfig = {username: "JackTheReaper", connections: 100};
            config_engine_fast(userConfig);
        }

        // 4. Bind the event listener inside the module scope
        document.getElementById('obj-btn').addEventListener('click', send_obj);
        document.getElementById('sum-btn').addEventListener('click', get_sum_of_arr);
        document.getElementById('connections-slow-btn').addEventListener('click', evaluate_connection_slow);
        document.getElementById('connections-fast-btn').addEventListener('click', evaluate_connection_fast);
    </script>
</body>

</html>
